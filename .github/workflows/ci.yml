name: Node.js CI

on:
  push:
    branches: [main, "ops/**", "fix/**", "feat/**"]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find . -type f -name '*.js' -not -path './node_modules/*' -not -path './data/*' -print0)
      - name: Verify production start command
        run: node -e "const p=require('./package.json'); if(p.scripts?.start!=='node server.js') process.exit(1)"
